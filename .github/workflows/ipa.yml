name: Fabriquer l'appli iPhone (.ipa)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Construire la page de l'appli (Vite)
        run: |
          npm install
          npm run build

      - name: Garder la page compilée (contrôle)
        uses: actions/upload-artifact@v4
        with:
          name: page-web
          path: dist

      - name: Créer le projet iOS (Capacitor)
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Réglages iPhone (GPS, écran toujours allumé, icône, nom)
        run: |
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" $PL 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Ta position sert à te suivre sur la carte, à chronométrer ton trajet en cours et à situer les évènements signalés." $PL
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Trajet Mayotte" $PL 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Trajet Mayotte" $PL
          cp ios-ressources/AppIcon-512@2x.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("ios/App/App/AppDelegate.swift")
          s = p.read_text()
          # L'iPhone ne se met pas en veille tant que l'appli est ouverte
          s = re.sub(r"(didFinishLaunchingWithOptions[^{]*\{)", r"\1\n        UIApplication.shared.isIdleTimerDisabled = true", s, count=1)
          s = re.sub(r"(func applicationDidBecomeActive\(_ application: UIApplication\) \{)", r"\1\n        UIApplication.shared.isIdleTimerDisabled = true", s, count=1)
          assert s.count("isIdleTimerDisabled") == 2, s
          p.write_text(s)
          print("AppDelegate : mise en veille désactivée")
          PY

      - name: Compiler sans signature
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then CIBLE="-workspace App.xcworkspace"; else CIBLE="-project App.xcodeproj"; fi
          xcodebuild $CIBLE -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          test -d build/Build/Products/Release-iphoneos/App.app

      - name: Emballer en .ipa
        run: |
          cd ios/App
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "$GITHUB_WORKSPACE/TrajetMayotte.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/TrajetMayotte.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: TrajetMayotte-ipa
          path: TrajetMayotte.ipa

      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" TrajetMayotte.ipa \
            --title "Trajet Mayotte, fabrication ${{ github.run_number }}" \
            --notes "Fichier TrajetMayotte.ipa non signé, à installer sur iPhone avec Sideloadly."
